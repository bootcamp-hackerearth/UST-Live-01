<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>HealthAxis Admin</title>

    <base href="/" />

    <script>
        (function () {
            "use strict";

            const externalLoginPath = "/external-login";
            const dashboardPath = "/dashboard";
            const loginPath = "/login";

            const accessTokenKey = "healthaxis_admin_access_token";
            const refreshTokenKey = "healthaxis_admin_refresh_token";
            const roleKey = "healthaxis_admin_role";
            const expiresAtKey = "healthaxis_admin_expires_at";
            const expiresInMinutesKey = "healthaxis_admin_expires_in_minutes";

            const currentPath = normalizePath(
                globalThis.location.pathname
            );

            if (currentPath !== externalLoginPath) {
                return;
            }

            const hashValue = globalThis.location.hash;

            if (!hashValue || hashValue.length <= 1) {
                globalThis.location.replace(loginPath);
                return;
            }

            const parameters = new URLSearchParams(
                hashValue.substring(1)
            );

            const accessToken = parameters.get("accessToken");

            if (!accessToken) {
                globalThis.location.replace(loginPath);
                return;
            }

            if (!isAdminToken(accessToken)) {
                globalThis.location.replace(loginPath);
                return;
            }

            globalThis.localStorage.setItem(
                accessTokenKey,
                accessToken
            );

            saveOptionalValue(
                refreshTokenKey,
                parameters.get("refreshToken")
            );

            globalThis.localStorage.setItem(
                roleKey,
                "Admin"
            );

            saveOptionalValue(
                expiresAtKey,
                parameters.get("expiresAt")
            );

            saveOptionalValue(
                expiresInMinutesKey,
                parameters.get("expiresInMinutes")
            );

            globalThis.history.replaceState(
                {},
                document.title,
                dashboardPath
            );

            globalThis.location.replace(dashboardPath);

            function normalizePath(path) {
                const lowerPath = path.toLowerCase();

                if (
                    lowerPath.length > 1 &&
                    lowerPath.endsWith("/")
                ) {
                    return lowerPath.slice(0, -1);
                }

                return lowerPath;
            }

            function saveOptionalValue(key, value) {
                if (value) {
                    globalThis.localStorage.setItem(key, value);
                }
            }

            function isAdminToken(token) {
                const payload = readJwtPayload(token);

                if (!payload) {
                    return false;
                }

                const role =
                    payload.role ||
                    payload.Role ||
                    payload[
                    "http://schemas.microsoft.com/ws/2008/06/identity/claims/role"
                    ];

                if (Array.isArray(role)) {
                    return role.some(function (item) {
                        return String(item).toLowerCase() === "admin";
                    });
                }

                return String(role).toLowerCase() === "admin";
            }

            function readJwtPayload(token) {
                const parts = token.split(".");

                if (parts.length < 2) {
                    return null;
                }

                try {
                    const base64Payload = parts[1]
                        .replaceAll("-", "+")
                        .replaceAll("_", "/");

                    const paddingLength =
                        (4 - base64Payload.length % 4) % 4;

                    const paddedPayload = base64Payload.padEnd(
                        base64Payload.length + paddingLength,
                        "="
                    );

                    return JSON.parse(
                        globalThis.atob(paddedPayload)
                    );
                } catch {
                    return null;
                }
            }
        })();

        globalThis.healthAxisAdminLogin = {
            getHash: function () {
                return globalThis.location.hash || "";
            }
        };
    </script>

    <link rel="stylesheet"
          href="css/bootstrap/bootstrap.min.css" />

    <link href="HealthAxis_Admin.styles.css"
          rel="stylesheet" />

    <link href="css/app.css?v=2003"
          rel="stylesheet" />

    <link rel="icon"
          type="image/png"
          href="favicon.png" />
</head>

<body>
    <div id="app">
        <section class="admin-startup-page">
            <div class="admin-startup-card">
                <div class="admin-startup-loader"></div>

                <h1>Opening HealthAxis Admin</h1>

                <p>
                    Please wait while the admin portal is prepared.
                </p>
            </div>
        </section>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
