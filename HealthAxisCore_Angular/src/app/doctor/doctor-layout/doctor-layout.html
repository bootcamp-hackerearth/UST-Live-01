<div class="doctor-shell">
  <nav class="doctor-navbar">
    <a routerLink="/doctor/dashboard" class="brand">
      <span class="brand-logo-mark">
        <img src="HealthAxisAngularLogo.png"
             alt="HealthAxis Logo" />
      </span>

      <span class="brand-copy">
        <strong>HealthAxis</strong>
        <small>Doctor Portal</small>
      </span>
    </a>

    <div class="nav-links">
      <a routerLink="/doctor/dashboard"
         routerLinkActive="active-link"
         class="nav-link">
        Dashboard
      </a>

      <a routerLink="/doctor/schedule"
         routerLinkActive="active-link"
         class="nav-link">
        Today’s Schedule
      </a>

      <a routerLink="/doctor/patients"
         routerLinkActive="active-link"
         class="nav-link">
        Patients
      </a>
    </div>

    <div class="navbar-actions">
      <a routerLink="/doctor/dashboard" class="profile-button">
        <span class="profile-avatar">
          {{ doctorName.charAt(0) }}
        </span>

        <span class="profile-copy">
          <small>Logged in as</small>
          <strong>{{ doctorName }}</strong>
        </span>
      </a>

      <button type="button"
              class="logout-button"
              (click)="logout()">
        Logout
      </button>
    </div>
  </nav>

  <main class="doctor-content">
    <router-outlet></router-outlet>
  </main>
</div>
