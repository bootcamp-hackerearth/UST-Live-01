<section class="profile-page">
  <div class="profile-header">
    <div>
      <span class="page-kicker">Patient Profile</span>

      <h1>Edit your profile</h1>

      <p>
        Keep your personal information updated for smoother appointment booking.
      </p>
    </div>

    <a routerLink="/patient/dashboard" class="back-link">
      Back to dashboard
    </a>
  </div>

  <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="profile-card">
    <div class="form-grid">
      <div class="form-group">
        <label>Full name</label>
        <input type="text" formControlName="fullName" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" />
      </div>

      <div class="form-group">
        <label>Phone number</label>
        <input type="text" formControlName="phoneNumber" />
      </div>

      <div class="form-group">
        <label>Date of birth</label>
        <input type="date" formControlName="dateOfBirth" />
      </div>

      <div class="form-group">
        <label>Gender</label>

        <select formControlName="gender">
          <option value="">Select gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Insurance ID</label>
        <input type="text" formControlName="insuranceID" />
      </div>
    </div>

    @if (successMessage) {
    <div class="success-message">
      {{ successMessage }}
    </div>
    }

    <button type="submit" class="save-button">
      Save Profile
    </button>
  </form>
</section>
