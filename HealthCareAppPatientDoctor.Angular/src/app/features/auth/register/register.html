<div class="register-page">

    <!-- Left Panel -->

    <div class="register-left">

        <div class="auth-glow one"></div>
        <div class="auth-glow two"></div>

        <div class="brand">

            <div class="brand-logo">
                HA
            </div>

            <div>

                <h2>HealthAxis</h2>

                <p>Smart Healthcare Platform</p>

            </div>

        </div>

        <span class="hero-badge">
            PATIENT REGISTRATION
        </span>

        <h1>
            Join
            <span>HealthAxis</span>
        </h1>

        <p>

            Create your patient account and begin your healthcare journey with
            secure appointments, medical records and experienced doctors.

        </p>

    </div>

    <!-- Right Panel -->

    <div class="register-right">

        <div class="register-card">

            <h2>Create Account</h2>

            <p>Register as a Patient</p>

            <form
                [formGroup]="registerForm"
                (ngSubmit)="register()">

                <div class="form-grid">

                    <div>

                        <label for="fullName">Full Name</label>

                        <input
                            id="fullName"
                            type="text"
                            class="form-control auth-input"
                            formControlName="fullName">

                    </div>

                    <div>

                        <label for="dateOfBirth">Date of Birth</label>

                        <input
                            id="dateOfBirth"
                            type="date"
                            class="form-control auth-input date-input"
                            formControlName="dateOfBirth">

                    </div>

                    <div>

                        <label for="gender">Gender</label>

                        <select
                            id = "gender"
                            class="form-select auth-input"
                            formControlName="gender">

                            <option value="">Select</option>
                            <option value="0">Male</option>
                            <option value="1">Female</option>
                            <option value="2">Other</option>

                        </select>

                    </div>

                    <div>

                        <label for="phoneNumber">Phone Number</label>

                        <input
                            id="phoneNumber"
                            class="form-control auth-input"
                            formControlName="phoneNumber">

                    </div>

                    <div>

                        <label for="email">Email</label>

                        <input
                            id="email"
                            type="email"
                            class="form-control auth-input"
                            formControlName="email">

                    </div>

                    <div>

                        <label for="insuranceId">Insurance ID</label>

                        <input
                            id="insuranceId"
                            class="form-control auth-input"
                            formControlName="insuranceId">

                    </div>

                    <div>

                        <label for="password">Password</label>

                        <input
                            id="password"
                            type="password"
                            class="form-control auth-input"
                            formControlName="password">

                    </div>

                    <div>

                        <label for="confirmPassword">Confirm Password</label>

                        <input
                            id="confirmPassword"
                            type="password"
                            class="form-control auth-input"
                            formControlName="confirmPassword">

                    </div>

                </div>

                <button
                    class="register-btn"
                    [disabled]="isLoading">

                    Create Account

                </button>

            </form>

            <div class="login-link">

                Already have an account?

                <a routerLink="/login">

                    Login

                </a>

            </div>

        </div>

    </div>

</div>
