<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="profile-card shadow">

                <div class="card-header">

                    <h2>

                        ✏️ Edit My Profile

                    </h2>

                </div>

                <div class="card-body">

                    @if(isLoading){

                    <div class="text-center py-5">

                        <div class="spinner-border text-primary">

                        </div>

                    </div>

                    }

                    @else{

                    <form
                        [formGroup]="profileForm"
                        (ngSubmit)="save()">

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                formControlName="fullName">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Date Of Birth

                            </label>

                            <input
                                type="date"
                                class="form-control"
                                formControlName="dateOfBirth">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Gender

                            </label>

                            <select
                                class="form-select"
                                formControlName="gender">

                                <option [value]="0">

                                    Male

                                </option>

                                <option [value]="1">

                                    Female

                                </option>

                                <option [value]="2">

                                    Other

                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                maxlength="10"
                                formControlName="phoneNumber">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email Address

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                formControlName="email"
                                readonly>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Insurance ID

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                formControlName="insuranceId">

                        </div>

                        <div class="text-center">

                            <button
                                class="btn btn-primary me-3"
                                type="submit"
                                [disabled]="isLoading">

                                Save Changes

                            </button>

                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                (click)="cancel()">

                                Cancel

                            </button>

                        </div>

                    </form>

                    }

                </div>

            </div>

        </div>

    </div>

</div>
