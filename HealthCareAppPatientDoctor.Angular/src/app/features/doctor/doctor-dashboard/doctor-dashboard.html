<div class="container py-5">

    <div class="text-center mb-5">

        <h2 class="fw-bold text-primary">

            👨‍⚕️ Doctor Dashboard

        </h2>

        @if(!isLoading && doctor){

        <p class="text-muted">

            Welcome,

            <strong>{{doctor.fullName}}</strong>

        </p>

        }

    </div>

    <div class="row g-4">

        <div class="col-md-6">

            <div class="dashboard-card shadow">

                <div class="card-body">

                    <h4>

                        📅 My Appointments

                    </h4>

                    <p>

                        View today's and upcoming appointments.

                    </p>

                    <a routerLink="/doctor/appointments" class="btn btn-primary">

                        View Appointments

                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-6">

            <div class="dashboard-card shadow">

                <div class="card-body">

                    <h4>

                        👤 My Profile

                    </h4>

                    <p>

                        View your doctor profile.

                    </p>

                    <a routerLink="/doctor/profile" class="btn btn-success">

                        View Profile

                    </a>

                </div>

            </div>

        </div>

    </div>

    <div class="text-center mt-5">

        <button class="btn btn-outline-danger" (click)="logout()">

            Logout

        </button>

    </div>

</div>
