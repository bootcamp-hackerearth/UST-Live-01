<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />

    <title>HealthAxis Admin</title>

    <base href="/blazor/" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet"
          href="css/bootstrap/bootstrap.min.css" />

    <link rel="stylesheet"
          href="css/app.css" />

    <link rel="stylesheet"
          href="HealthAxis_Admin.styles.css" />

    <style>
        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #172554
                );
            font-family:
                Arial,
                sans-serif;
        }

        #app {
            min-height: 100vh;
        }

        .admin-loading-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .admin-loading-card {
            width: min(500px, 100%);
            padding: 42px;
            border:
                1px solid
                rgba(148, 163, 184, 0.28);
            border-radius: 28px;
            color: #ffffff;
            background:
                rgba(15, 23, 42, 0.9);
            text-align: center;
            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.35);
        }

        .admin-loading-spinner {
            width: 68px;
            height: 68px;
            margin: 0 auto 24px;
            border:
                7px solid
                rgba(148, 163, 184, 0.28);
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation:
                healthaxis-spin
                0.9s
                linear
                infinite;
        }

        .admin-loading-card h1 {
            margin: 0 0 14px;
            font-size: 34px;
        }

        .admin-loading-card p {
            margin: 0;
            color: #cbd5e1;
            font-size: 17px;
        }

        #blazor-error-ui {
            display: none;
            position: fixed;
            right: 20px;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            padding: 16px;
            border-radius: 14px;
            color: #ffffff;
            background: #991b1b;
        }

        @keyframes healthaxis-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="admin-loading-page">
            <div class="admin-loading-card">
                <div class="admin-loading-spinner"></div>

                <h1>Opening HealthAxis Admin</h1>

                <p>
                    Please wait while the admin portal is prepared.
                </p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unexpected error occurred while opening
        HealthAxis Admin.
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
