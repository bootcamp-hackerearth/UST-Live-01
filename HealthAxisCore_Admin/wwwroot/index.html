<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthAxis Admin</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="loading-screen">

            <div class="loading-logo-wide">
                <img src="HealthAxisAdminLogoDark.png" alt="HealthAxis Logo" class="login-logo-image-wide" />
            </div>
        </div>

    </div>
    <script>
        globalThis.healthAxisScrollToElement = function (elementId) {
            const element = document.getElementById(elementId);

            if (element) {
                element.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        };
    </script>

    <script>
        window.healthAxisTheme = {
            setTheme: function (theme) {
                document.documentElement.setAttribute("data-theme", theme);
                localStorage.setItem("healthaxis_theme", theme);
            },

            getTheme: function () {
                return localStorage.getItem("healthaxis_theme") || "dark";
            },

            initializeTheme: function () {
                const theme = localStorage.getItem("healthaxis_theme") || "dark";
                document.documentElement.setAttribute("data-theme", theme);
                return theme;
            }
        };

        window.healthAxisTheme.initializeTheme();
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
