<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthAxisCore Admin</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="loading-screen">

            <div class="loading-logo">
                <img src="HealthAxisAdminLogo.png" alt="HealthAxis Logo" class="login-logo-image" />
            </div>
        </div>

    </div>
    <script>
        globalThis.healthAxisScrollToElement = function (elementId) {
            const element = document.getElementById(elementId);

            if (element) {
                element.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
