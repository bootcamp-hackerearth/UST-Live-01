<div class="modal-backdrop"
     *ngIf="visible">

  <button type="button"
          class="backdrop-close"
          aria-label="Close edit profile dialog"
          (click)="close()">
  </button>

  <dialog class="modal-box"
          open
          aria-labelledby="edit-profile-title">

    <div class="modal-header">
      <h3 id="edit-profile-title">Edit Profile</h3>

      <button type="button"
              class="close"
              aria-label="Close edit profile"
              (click)="close()">
        &times;
      </button>
    </div>

    <form class="form"
          [formGroup]="editForm"
          (ngSubmit)="saveChanges()">

      <input type="text"
             placeholder="Full Name"
             formControlName="fullName">

      <small class="error"
             *ngIf="f['fullName'].touched && f['fullName'].hasError('required')">
        Full Name is required
      </small>

      <small class="error"
             *ngIf="f['fullName'].touched && f['fullName'].hasError('pattern')">
        Enter name using alphabets only
      </small>

      <select formControlName="gender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <small class="error"
             *ngIf="f['gender'].touched && f['gender'].hasError('required')">
        Gender is required
      </small>

      <input type="tel"
             placeholder="Phone Number"
             formControlName="phoneNumber"
             maxlength="10">

      <small class="error"
             *ngIf="f['phoneNumber'].touched && f['phoneNumber'].hasError('required')">
        Phone number is required
      </small>

      <small class="error"
             *ngIf="f['phoneNumber'].touched && f['phoneNumber'].hasError('pattern')">
        Phone number must start with 6-9 and contain 10 digits
      </small>

      <input type="text"
             placeholder="Insurance ID (Optional)"
             formControlName="insuranceId">

      <small class="error"
             *ngIf="f['insuranceId'].touched && f['insuranceId'].hasError('pattern')">
        Insurance ID must contain only letters and numbers
      </small>

      <div class="actions">

        <button type="button"
                class="cancel"
                (click)="close()">
          Cancel
        </button>

        <button type="submit"
                class="save">
          Save Changes
        </button>

      </div>

    </form>

  </dialog>
</div>
