<!-- ✅ SIDEBAR WRAPPER -->
<div
  class="flex flex-col h-screen w-64 bg-[#0B5ED7] text-white shadow-lg
         fixed md:relative z-40 transition-transform duration-300
         md:translate-x-0"
  [class.-translate-x-full]="!isSidebarOpen"
>

  <!--  HEADER -->
  <div class="p-5 border-b border-blue-400">
    <h2 class="text-xl font-bold tracking-wide">
      Healthcare
    </h2>
  </div>

  <!--  MENU -->
  <ul class="flex-1 p-4 space-y-2 overflow-y-auto">

    @for(item of menuItems; track item.label){

      <li>

        <!--  LINK (Button Style ) -->
        @if(item.link){
          <a
            [routerLink]="item.link" 
            routerLinkActive="bg-white !text-[#0B5ED7]"
            class="flex items-center gap-3 w-full px-4 py-2 rounded-lg 
            no-underline text-white font-medium text-sm 
            bg-white/10 hover:bg-[#14B8A6]
            transition duration-200">


            <span class="text-lg">{{item.icon}}</span>
            <span>{{item.label}}</span>

          </a>
        }

        <!--  ACTION (also consistent) -->
        @if(item.type === 'action'){
          <button
            (click)="item.action()"
            class="flex items-center gap-3 w-full px-4 py-2 rounded-lg
                   text-white text-sm font-medium
                   bg-white/10
                   hover:bg-[#14B8A6]
                   transition duration-200">

            <span class="text-lg">{{item.icon}}</span>
            <span>{{item.label}}</span>

          </button>
        }

      </li>

    }

  </ul>

  <!--  FOOTER -->
  <div class="p-4 border-t border-blue-400 text-xs text-center opacity-80">
    © Healthcare App
  </div>

</div>

<!--  MOBILE TOGGLE BUTTON -->
<button
  class="md:hidden fixed top-4 left-4 bg-[#0B5ED7] text-white p-2 rounded shadow z-50"
  (click)="isSidebarOpen = !isSidebarOpen"
>
  ☰
</button>

<!--  OVERLAY -->
@if(isSidebarOpen){
  <div
    class="fixed inset-0 bg-black/30 z-30 md:hidden"
    (click)="isSidebarOpen = false">
  </div>
}

<!--  MODAL -->
@if(showBookingModal){
  <app-book-appointment
    (close)="showBookingModal = false">
  </app-book-appointment>
}

@if(showLogoutConfirm){

  <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">

    <div class="bg-white p-6 rounded-2xl shadow-lg w-80 text-center">

      <h3 class="text-lg font-semibold mb-3">
        Confirm Logout
      </h3>

      <p class="text-gray-600 mb-6 text-sm">
        Are you sure you want to logout?
      </p>

      <div class="flex gap-3 justify-center">

        <button
          (click)="confirmLogout()"
          class="px-4 py-2 bg-red-500 text-white rounded-lg text-sm">
          Yes, Logout
        </button>

        <button
          (click)="cancelLogout()"
          class="px-4 py-2 bg-gray-200 rounded-lg text-sm">
          Cancel
        </button>

      </div>

    </div>

  </div>

}
