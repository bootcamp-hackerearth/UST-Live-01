<section class="hero-section">

    <div class="hero-content">

        <h1 class="hero-title">
            Healthcare Management System
        </h1>

        <p class="hero-subtitle">
            Secure, Smart and Modern Healthcare Platform
        </p>

        <div class="buttons">

            <button class="btn btn-primary"
                    (click)="openLogin()">
                Login
            </button>

            <button class="btn btn-outline-primary"
                    (click)="openRegister()">
                Register
            </button>

        </div>

    </div>

</section>

@if(showLogin){
    <app-login-modal
        (modalClosed)="closeModal()">
    </app-login-modal>
}

@if(showRegister){
    <app-register-modal
        (registerModalClosed)="closeModal()">
    </app-register-modal>
}
