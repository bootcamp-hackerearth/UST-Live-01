<div class="min-h-screen bg-slate-50 p-6">

    <div class="max-w-4xl mx-auto">

        <div class="mb-8">

            <h1
              class="text-3xl font-bold">

                Update Health Record

            </h1>

            <p class="text-slate-500">

                Modify diagnosis and treatment
                information

            </p>

        </div>

        @if(loading){

            <div class="text-center py-10">

                Loading...

            </div>

        }

        @else {

            <div
              class="bg-white rounded-3xl
                     shadow-lg p-8">

                <form
                  [formGroup]="form"
                  (ngSubmit)="updateRecord()">

                    <div class="space-y-6">

                        <div>

                            <label
                              class="font-medium">

                                Diagnosis

                            </label>

                            <textarea
                              rows="4"
                              formControlName="diagnosis"
                              class="w-full mt-2
                                     border border-gray-300
                                     rounded-xl p-4">
                            </textarea>

                        </div>

                        <div>

                            <label
                              class="font-medium">

                                Prescription

                            </label>

                            <textarea
                              rows="4"
                              formControlName="prescription"
                              class="w-full mt-2
                                     border border-gray-300
                                     rounded-xl p-4">
                            </textarea>

                        </div>

                        <div>

                            <label
                              class="font-medium">

                                Notes

                            </label>

                            <textarea
                              rows="4"
                              formControlName="notes"
                              class="w-full mt-2
                                     border border-gray-300
                                     rounded-xl p-4">
                            </textarea>

                        </div>

                    </div>

                    <button
                      type="submit"
                      class="mt-8 w-full
                             bg-blue-600
                             hover:bg-blue-700
                             text-white py-4
                             rounded-xl">

                        Update Record

                    </button>

                </form>

            </div>

        }

    </div>

</div>
