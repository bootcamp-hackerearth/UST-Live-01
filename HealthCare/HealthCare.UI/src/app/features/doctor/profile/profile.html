<div class="min-h-screen bg-slate-50 p-6">

    <div class="max-w-4xl mx-auto">

        <!-- Header -->

        <div class="mb-8">

            <h1 class="text-3xl font-bold text-slate-800">
                My Profile
            </h1>

            <p class="text-slate-500 mt-2">
                View and update your personal information
            </p>

        </div>

        <!-- Card -->

        <div class="bg-white rounded-3xl shadow-lg p-8">

            @if(loading){

                <div class="text-center py-10">

                    Loading profile...

                </div>

            }

            @else {

                <form
                    [formGroup]="profileForm"
                    (ngSubmit)="updateProfile()">

                    <div class="grid md:grid-cols-2 gap-6">

                        <!-- Name -->

                        <div>

                            <label
                                class="block mb-2 font-medium text-slate-700">

                                Full Name

                            </label>

                            <input
                                type="text"
                                formControlName="firstName"
                                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                        </div>

                        <!-- Email -->

                        <div>

                            <label
                                class="block mb-2 font-medium text-slate-700">

                                Email Address

                            </label>

                            <input
                                type="email"
                                formControlName="email"
                                readonly
                                class="w-full bg-gray-100 border border-gray-300 rounded-xl p-3">

                        </div>

                        <!-- Phone -->

                        <div>

                            <label
                                class="block mb-2 font-medium text-slate-700">

                                Phone Number

                            </label>

                            <input
                                type="text"
                                formControlName="phoneNumber"
                                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                        </div>

                        <!-- Gender -->

                        <div>

                            <label
                                class="block mb-2 font-medium text-slate-700">

                                Gender

                            </label>

                            <select
                                formControlName="gender"
                                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                                <option value="">Select Gender</option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>

                        <!-- DOB -->

                        <div>

                            <label
                                class="block mb-2 font-medium text-slate-700">

                                Date of Birth

                            </label>

                            <input
                                type="date"
                                formControlName="dateofbirth"
                                class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">

                        </div>

                    </div>

                    <!-- Button -->

                    <div class="mt-8">

                        <button
                            type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl font-semibold transition">

                            Update Profile

                        </button>

                    </div>

                </form>

            }

        </div>

    </div>

</div>
