<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-md p-6">

  <!--  HEADER -->
  <div class="mb-6">
    <h2 class="text-2xl font-bold text-[#0B5ED7]">
      My Profile
    </h2>
  </div>

  <!--  LOADING -->
@if(loading()){

  <div class="text-center py-10">
    Loading profile...
  </div>

}
@else {

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <div>
      <label>Doctor ID</label>
      <p>{{doctor().doctorId}}</p>
    </div>

    <div>
      <label>Full Name</label>
      <p>{{doctor().fullName}}</p>
    </div>

    <div>
      <label>Email</label>
      <p>{{doctor().email || 'Not available'}}</p>
    </div>

    <div>
      <label>Specialisation</label>
      <p>{{doctor().specialisation}}</p>
    </div>

    <div>
      <label>Experience</label>
      <p>{{doctor().yearsOfExperience}} years</p>
    </div>

    <div>
      <label>Consultation Fee</label>
      <p>₹ {{doctor().consultationFee}}</p>
    </div>

  </div>

}

</div>
