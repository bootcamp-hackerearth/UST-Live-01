<div class="min-h-screen bg-slate-50 p-6">

  <!-- HEADER -->
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-slate-800">
      Add Leave
    </h1>
    <p class="text-slate-500">
      Manage your unavailable dates
    </p>
  </div>

  <!-- CARD -->
  <div class="bg-white rounded-2xl shadow p-6 max-w-3xl space-y-4">

    <!-- INPUT ROW -->
    <div class="flex flex-col md:flex-row gap-3 items-end">

      <!-- DATE -->
      <div class="flex-1">
        <label class="text-sm text-gray-500">Leave Date</label>
        <input
          type="date"
          [(ngModel)]="selectedDate"
          [min]="today"
          class="border rounded-lg p-2 w-full text-sm"/>
      </div>

      <!-- REASON -->
      <div class="flex-1">
        <label class="text-sm text-gray-500">Reason</label>
        <input
          type="text"
          [(ngModel)]="reason"
          placeholder="Optional"
          class="border rounded-lg p-2 w-full text-sm"/>
      </div>

      <!-- ADD -->
      <button
        (click)="addDate()"
        class="h-[38px] px-4 bg-blue-600 text-white rounded-lg text-sm">
        Add
      </button>

    </div>

    <!-- LIST -->
    @if(leaves().length > 0){

      <div>
        <h3 class="text-md font-semibold mb-2">
          Selected Leave Dates
        </h3>

        <div class="space-y-2">

          @for(leave of leaves(); track leave.leaveDate; let i = $index){

            <div class="flex justify-between items-center bg-slate-100 rounded-lg px-4 py-2">

              <div>
                <p class="text-sm font-medium">
                  {{leave.leaveDate}}
                </p>

                @if(leave.reason){
                  <p class="text-xs text-gray-500">
                    {{leave.reason}}
                  </p>
                }
              </div>

              <button
                (click)="removeDate(i)"
                class="text-red-500 text-sm">
                Remove
              </button>

            </div>

          }

        </div>
      </div>

    }

    <!-- SUBMIT -->
    <button
      (click)="submitLeaves()"
      [disabled]="loading()"
      class="w-full bg-cyan-600 text-white py-3 rounded-lg text-sm">

      {{ loading() ? 'Saving...' : 'Submit Leaves' }}

    </button>

  </div>

</div>
