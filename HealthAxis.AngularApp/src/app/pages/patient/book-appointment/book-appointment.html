<div class="container">

  <h2>Book Appointment</h2>

  <div *ngIf="doctor()">

    <h3>{{ doctor().doctorName }}</h3>
    <p>{{ doctor().specialisation }}</p>

  </div>

  <h4>Select Date</h4>

  <input type="date"
         (change)="onDateChange($any($event.target).value)" />

  <h4>Select Time Slot</h4>


  <div class="slots">

    <button *ngFor="let slot of ['10:00','11:00','12:00','14:00','15:00']"
            (click)="selectSlot(slot)"
            [class.selected]="selectedSlot() === slot">
      {{
     slot === '14:00' ? '02:00 PM' :
           slot === '15:00' ? '03:00 PM' :
           slot + ' ' + 'AM'
          }}
    </button>

  </div>


  <p *ngIf="selectedSlot()">Selected: {{ selectedSlot() }}</p>

  <button (click)="confirmBooking()">Confirm Booking</button>

  <p>{{ message() }}</p>

</div>
