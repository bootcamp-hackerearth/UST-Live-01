<div class="dashboard">
  <div class="top-bar">
    <h1>Welcome {{ auth().name }}!</h1>

    <button class="logout" (click)="logout()">
      Logout
    </button>

  </div>


  <div class="cards">
    <div class="card" routerLink="/patient/find-doctor" style="cursor:pointer">
      <h3>🩺 Find Doctor</h3>
      <p>Search and book appointments instantly</p>
    </div>


    <div class="card"
         routerLink="/patient/appointments"
         style="cursor:pointer">
      <h3>📅 Appointments</h3>
      <p>View all your booked appointments</p>
    </div>


    <div class="card"
         routerLink="//patient/health-records"
         style="cursor:pointer">
      <h3>📂 Health Records</h3>
      <p>Access prescriptions and reports</p>
    </div>


  </div>
</div>
