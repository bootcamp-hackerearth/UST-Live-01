<div class="dashboard">
  <div class="top-bar">
    <h1>Welcome {{ auth().name }}!</h1>
    <button class="logout" routerLink="/login">Logout</button>
  </div>

  <div class="cards">
    <div class="card" routerLink="/my-patients">
      <h3>👨‍⚕️ Your Patients</h3>
      <p>View and manage your patients</p>
    </div>

    <div class="card" routerLink="/doctor-appointments">
      <h3>📆 Upcoming Appointments</h3>
      <p>Check today's scheduled appointments</p>
    </div>

    <div class="card" routerLink="/today-appointments">
      <h3>📅 Today's Appointments</h3>
      <p>View today's scheduled appointments</p>
    </div>

  </div>
</div>
