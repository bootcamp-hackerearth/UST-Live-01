<div class="container">

  <h2>Your Patients</h2>
  <button class="back-btn" (click)="goBack()">
    ← Back to Dashboard
  </button>

  <div *ngIf="patients().length === 0">
    No patients found.
  </div>

  <div *ngFor="let patient of patients()"
       class="patient-item">

    <a [routerLink]="['/doctor/patient-details', patient.patientId]">

      {{ patient.patientName }}

    </a>

  </div>

  <p>{{ message() }}</p>

</div>
