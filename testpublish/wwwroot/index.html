    <script>
        window.authLocalStorage = {
            setItem: function (key, value) {
                if (
                    value !== null &&
                    value !== undefined
                ) {
                    localStorage.setItem(
                        key,
                        value
                    );
                }
            },

            getItem: function (key) {
                return localStorage.getItem(
                    key
                );
            },

            removeItem: function (key) {
                localStorage.removeItem(
                    key
                );
            }
        };
    </script>
