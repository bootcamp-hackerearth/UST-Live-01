<div class="login-page">

  <section class="login-shell">

    <button type="button" class="back-btn" (click)="goHome()">
      ← Back to Home
    </button>

    <div class="brand-block">

      <div class="brand-icon">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M24 10c-6 0-11 5-11 11 0 11 19 24 19 24s19-13 19-24c0-6-5-11-11-11-4 0-7 2-8 5-1-3-4-5-8-5Z"
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linejoin="round" />
          <path d="M18 32h8l4-9 6 18 4-9h7"
                fill="none"
                stroke="currentColor"
                stroke-width="4"
                stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
      </div>

      <span>HealthAxis</span>

    </div>

    <div class="login-card">

      <div class="form-header">
        <p class="small-label">Secure portal access</p>
        <h2>Welcome back</h2>
        <p>Sign in to continue to your HealthAxis account</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <div class="field">
          <label>Email address</label>
          <input
            type="email"
            formControlName="email"
            placeholder="name@example.com"
            [class.invalid]="email?.invalid && (email?.touched || submitted)"
          />

          <div class="error-text" *ngIf="email?.invalid && (email?.touched || submitted)">
            <span *ngIf="email?.errors?.['required']">Email is required.</span>
            <span *ngIf="email?.errors?.['email']">Enter a valid email address.</span>
          </div>
        </div>

        <div class="field">
          <label>Password</label>

          <div class="password-wrap">
            <input
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="Enter your password"
              [class.invalid]="password?.invalid && (password?.touched || submitted)"
            />

            <button
              type="button"
              class="eye-btn"
              (click)="showPassword = !showPassword">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          <div class="error-text" *ngIf="password?.invalid && (password?.touched || submitted)">
            <span *ngIf="password?.errors?.['required']">Password is required.</span>
            <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>

        <button type="submit" class="login-btn" [disabled]="loginForm.invalid && submitted">
          Sign In
        </button>

      </form>

      <p class="register-line">
        Don’t have an account?
        <a routerLink="/register">Register</a>
      </p>

    </div>

  </section>

</div>
