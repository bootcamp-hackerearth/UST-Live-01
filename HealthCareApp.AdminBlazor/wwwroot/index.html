<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthCareApp.AdminBlazor</title>
    <base href="/blazor/" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/admin-theme.css" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HealthCareApp.AdminBlazor.styles.css" rel="stylesheet" />

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="ha-app-loader">
            <div class="ha-loader-card">
                <div class="ha-loader-logo">HA</div>

                <h1 class="ha-loader-title">
                    Health<span>Axis</span>
                </h1>

                <p class="ha-loader-subtitle">
                    Preparing your secure admin workspace...
                </p>

                <div class="ha-loader-progress">
                    <div class="ha-loader-progress-bar"></div>
                </div>

                <div class="ha-loader-caption">
                    Admin Portal loading
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    js/clipboard-helper.jsscript>
</body>

</html>
