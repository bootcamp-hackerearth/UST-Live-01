<section
  class="dashboard-shell"
  [class.sidebar-closed]="isSidebarClosed()"
>
  @if (!isSidebarClosed()) {
    <aside class="sidebar-area">
      <app-sidebar></app-sidebar>

      <button
        type="button"
        class="sidebar-toggle inside-sidebar"
        aria-label="Close sidebar"
        (click)="toggleSidebar()"
      >
        <span class="toggle-lines">
  <span></span>
  <span></span>
  <span></span>
</span>
      </button>
    </aside>
  }

  <main class="dashboard-main">
    @if (isSidebarClosed()) {
      <button
        type="button"
        class="sidebar-toggle open-sidebar"
        aria-label="Open sidebar"
        (click)="toggleSidebar()"
      >
        ☰
      </button>
    }

    <app-topbar></app-topbar>

    <section class="dashboard-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</section>
