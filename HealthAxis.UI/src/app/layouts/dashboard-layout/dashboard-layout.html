<section
  class="dashboard-shell"
  [class.sidebar-closed]="isSidebarClosed()"
>
  @if (!isSidebarClosed()) {
    <button
      type="button"
      class="mobile-sidebar-backdrop"
      aria-label="Close navigation menu"
      (click)="closeSidebar()"
    ></button>

    <aside class="sidebar-area">
      <app-sidebar
        (navigationRequested)="handleSidebarNavigation()"
        (logoutRequested)="openLogoutDialog()"
      ></app-sidebar>

      <button
        type="button"
        class="sidebar-toggle close-sidebar"
        aria-label="Close sidebar"
        (click)="closeSidebar()"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M15 6l-6 6 6 6"></path>
        </svg>
      </button>
    </aside>
  }

  <main class="dashboard-main">
    @if (isSidebarClosed()) {
      <button
        type="button"
        class="sidebar-toggle open-sidebar"
        aria-label="Open sidebar"
        (click)="toggleSidebar()"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M9 6l6 6-6 6"></path>
        </svg>
      </button>
    }

    <app-topbar
      (logoutRequested)="openLogoutDialog()"
    ></app-topbar>

    <section class="dashboard-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</section>

@if (isLogoutDialogOpen()) {
  <div class="logout-dialog-backdrop">
    <dialog
      open
      class="logout-dialog"
      aria-labelledby="logoutDialogTitle"
      aria-describedby="logoutDialogDescription"
    >
      <button
        type="button"
        class="logout-dialog-close"
        aria-label="Close logout confirmation"
        (click)="closeLogoutDialog()"
      >
        ×
      </button>

      <span
        class="logout-dialog-icon"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path
            d="M14 4h5a2 2 0 012 2v12a2 2 0 01-2 2h-5"
          ></path>
        </svg>
      </span>

      <h2 id="logoutDialogTitle">
        Confirm Logout
      </h2>

      <p id="logoutDialogDescription">
        Are you sure you want to log out of your
        HealthAxis account?
      </p>

      <div class="logout-dialog-actions">
        <button
          type="button"
          class="cancel-logout-button"
          (click)="closeLogoutDialog()"
        >
          Stay Logged In
        </button>

        <button
          type="button"
          class="confirm-logout-button"
          (click)="confirmLogout()"
        >
          Logout
        </button>
      </div>
    </dialog>
  </div>
}
