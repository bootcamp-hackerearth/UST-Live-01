<header class="public-header">

  <nav
    class="main-navbar"
    aria-label="Public navigation"
  >
    <a
      href="/"
      class="brand"
      aria-label="HealthAxis home"
      (click)="navigateToSection('home', $event)"
    >
      <span
        class="brand-logo"
        aria-hidden="true"
      >
        <span class="medical-cross"></span>
      </span>

      <span class="brand-name">
        <strong>HealthAxis</strong>
        <small>Digital Hospital</small>
      </span>
    </a>

    <div class="navigation-links">
      <button
        type="button"
        class="section-link"
        (click)="navigateToSection('home')"
      >
        Home
      </button>

      <button
        type="button"
        class="section-link"
        (click)="navigateToSection('about-us')"
      >
        About Us
      </button>

      <button
        type="button"
        class="section-link"
        (click)="navigateToSection('find-doctors')"
      >
        Find Doctors
      </button>

      <button
        type="button"
        class="section-link"
        (click)="navigateToSection('contact')"
      >
        Contact
      </button>

      <a
        routerLink="/login"
        routerLinkActive="active"
        class="login-link"
      >
        Login
      </a>

      <a
        routerLink="/register"
        routerLinkActive="active"
        class="register-link"
      >
        Register
      </a>
    </div>
  </nav>

</header>

<router-outlet></router-outlet>
