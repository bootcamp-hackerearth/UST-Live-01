<header class="topbar">
  <div class="topbar-left">
    <p>{{ getGreeting() }}</p>
    <h1>{{ authService.role() }} Portal</h1>
  </div>

  <div class="topbar-right">
    @if (authService.role() === 'Doctor') {
      <button
        type="button"
        class="doctor-status-toggle"
        [class.inactive]="doctorStatusState.isActive() === false"
        [disabled]="statusUpdating() || doctorStatusState.isActive() === null"
        (click)="toggleDoctorStatus()"
      >
        @if (statusUpdating()) {
          Updating...
        } @else {
          {{ getDoctorStatusText() }}
        }
      </button>
    }

    <div class="time-card">
      <span>🕘</span>

      <div>
        <strong>{{ currentTime() | date: 'hh:mm a' }}</strong>
        <small>{{ currentTime() | date: 'EEE, dd MMM yyyy' }}</small>
      </div>
    </div>

    <div class="profile-wrapper" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="profile-button"
        (click)="toggleProfileMenu()"
      >
        <span class="profile-icon">👥</span>

        <div>
          <strong>{{ authService.role() }}</strong>
        </div>

        <span class="dropdown-arrow">
          {{ isProfileMenuOpen() ? '⌃' : '⌄' }}
        </span>
      </button>

      @if (isProfileMenuOpen()) {
        <div class="profile-menu">
          <a [routerLink]="profileRoute()" (click)="isProfileMenuOpen.set(false)">
            <span>👤</span>
            View Profile
          </a>

          <button type="button" (click)="goToChangePassword()">
            <span>🔐</span>
            Change Password
          </button>

          <button type="button" (click)="logout()">
            <span>🚪</span>
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>

@if (statusError()) {
  <div class="doctor-status-message error">
    {{ statusError() }}
  </div>
}
