<aside class="sidebar">
  <a routerLink="/" class="brand-card">
    <div class="brand-icon">✚</div>

    <div>
      <h2>HealthAxis</h2>
      <p>{{ authService.role() }} Portal</p>
    </div>
  </a>

  <!-- <div class="care-status">
    <div class="pulse"></div>

    <div>
      <strong>Hospital System Online</strong>
      <span>JWT secured access</span>
    </div>
  </div> -->

  <nav class="menu">
    @for (item of menuItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
      >
        <span class="menu-icon">{{ item.icon }}</span>
        <span class="menu-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-bottom">
    <a [routerLink]="contactRoute()" class="contact-btn">
      <span>☎️</span>
      Contact Us
    </a>

    <button type="button" class="logout-btn" (click)="logout()">
      <span>🚪</span>
      Logout
    </button>
  </div>
</aside>
