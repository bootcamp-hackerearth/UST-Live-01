    <h2 class="logo">Health<span>Sphere</span></h2>
    <p>Care operations portal</p>
  </div>

  <ul>
    <li routerLink="/patient-dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <span>🏠</span> Dashboard
    </li>
    <li routerLink="/appointments" routerLinkActive="active">
      <span>📅</span> Appointments
    </li>
    <li routerLink="/doctors" routerLinkActive="active">
      <span>👨‍⚕️</span> Doctors
    </li>

      <span>📄</span> Records
    </li>

      <span>🚪</span> Logout
    </li>
  </ul>
</aside>
