<div class="health-login-page">
  <a class="back-home-link" routerLink="/">
    ← Back to Home
  </a>

  <section class="login-card">
    <div class="login-logo">H</div>

    <div class="login-heading">
      <span>Secure Access</span>
      <h1>Welcome back</h1>
      <p>
        Login to continue to your HealthApp workspace.
      </p>
    </div>

    @if (errorMessage) {
      <div class="login-alert">
        {{ errorMessage }}
      </div>
    }

    <form class="login-form" (ngSubmit)="login()">
      <div class="login-field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          class="login-control"
          placeholder="Enter email"
          [(ngModel)]="email"
          autocomplete="email"
        />
      </div>

      <div class="login-field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="login-control"
          placeholder="Enter password"
          [(ngModel)]="password"
          autocomplete="current-password"
        />
      </div>

      <button class="login-submit-button" type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Login' }}
      </button>
    </form>

    <div class="login-footer">
      <span>New patient?</span>
      <a routerLink="/register">Create patient account</a>
    </div>
  </section>

  @if (isLoading) {
    <div class="login-loading-backdrop">
      <div class="login-loading-box">
        <div class="loading-logo">H</div>

        <h3>Signing in</h3>
        <p>Please wait while HealthApp verifies your credentials.</p>

        <div class="login-popup-progress">
          <div class="login-popup-progress-bar"></div>
        </div>
      </div>
    </div>
  }
</div>
