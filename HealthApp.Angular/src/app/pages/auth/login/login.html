<div class="login-page">
  <div class="login-card">
    
    <div class="login-left-panel">
      <div class="login-brand">
        <div class="login-brand-icon">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <h1>Health<span>App</span></h1>
        <p>Welcome to the healthcare portal. Login to continue to your dashboard.</p>
      </div>
    </div>

    <div class="login-form-panel">
      <button class="back-button" type="button" (click)="goBackHome()" [disabled]="isLoading()">
        <i class="bi bi-arrow-left"></i> Back to Home
      </button>

      <div class="login-form-wrapper">
        <div class="login-header">
          <div class="login-header-icon">
            <i class="bi bi-person-circle"></i>
          </div>
          <h2>Login</h2>
          <p>Enter your email and password to continue.</p>
        </div>

        <form (ngSubmit)="login()">
          <div class="form-group">
            <label for="email">
              <i class="bi bi-envelope"></i> Email Id
            </label>
            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              placeholder="Enter email address"
              autocomplete="email"
              [disabled]="isLoading()"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">
              <i class="bi bi-shield-lock"></i> Password
            </label>
            <input
              id="password"
              name="password"
              type="password"
              [(ngModel)]="password"
              placeholder="Enter password"
              autocomplete="current-password"
              [disabled]="isLoading()"
              required
            />
          </div>

          <button class="login-submit-btn" type="submit" [disabled]="isLoading()">
            @if (isLoading()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
              Logging in...
            } @else {
              <i class="bi bi-box-arrow-right"></i> Login
            }
          </button>
        </form>

        <div class="login-footer">
          <span>New patient?</span>
          <a routerLink="/register">Create an account</a>
        </div>
      </div>
    </div>
  </div>
</div>
