<aside class="sidebar">
  <div class="brand">
    <h2>Health<span>Axis</span></h2>
    <p>Doctor Portal</p>
  </div>

  <ul class="menu">

    <li routerLink="/doctor-dashboard" routerLinkActive="active">
      <span>🏠</span>
      Dashboard
    </li>

    <li routerLink="/doctor_appointments" routerLinkActive="active">
      <span>📅</span>
      Appointments
    </li>

    <li routerLink="/doctor_health-records" routerLinkActive="active">
      <span>📄</span>
      Records
    </li>

    <li routerLink="/d_leave" routerLinkActive="active">
      <span>📅</span>
      Leave
    </li>

    <li (click)="logout()" class="logout">
      <span>↪</span>
      Logout
    </li>

  </ul>
</aside>

<app-popup
  [visible]="popupVisible"
  [title]="popupTitle"
  [message]="popupMessage"
  [type]="'warning'"
  (closed)="closePopup()"
  (confirmed)="confirmLogout()">
</app-popup>
