<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthApp Admin</title>
    <base href="/" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="HealthApp.AdminBlazor.styles.css" />
</head>

<body>
    <div id="app">
        <div class="initial-loading-page">
            <div class="initial-loading-card">
                <div class="initial-loading-logo">H</div>

                <h1>HealthApp Admin</h1>
                <p>Preparing your admin console...</p>

                <div class="initial-loading-spinner" aria-hidden="true"></div>

                <div class="initial-loading-progress">
                    <div class="initial-loading-progress-bar"></div>
                </div>

                <span class="initial-loading-caption">
                    Loading application resources
                </span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&#x2715;</span>
    </div>

    <script>
        window.copyHealthAppText = async function (text) {
            if (typeof text !== "string" || text.length === 0) {
                return false;
            }

            try {
                if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (error) {
                console.warn("Modern clipboard API failed; using fallback copy.", error);
            }

            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.setAttribute("readonly", "");
            textArea.setAttribute("aria-hidden", "true");
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "-9999px";
            textArea.style.opacity = "0";

            document.body.appendChild(textArea);

            try {
                textArea.focus();
                textArea.select();
                textArea.setSelectionRange(0, textArea.value.length);
                return document.execCommand("copy");
            } catch (error) {
                console.error("Fallback clipboard copy failed.", error);
                return false;
            } finally {
                document.body.removeChild(textArea);
            }
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
