<div class="password-page">
  <header class="page-header">
    <div>
      <h1>Change Password</h1>
      <p>Update your account password securely.</p>
    </div>
  </header>

  @if (errorMessage) {
    <div class="alert-error">
      {{ errorMessage }}
    </div>
  }

  @if (successMessage) {
    <div class="alert-success">
      {{ successMessage }}
    </div>
  }

  <form class="password-card" (ngSubmit)="submit()">
    <div class="form-group">
      @if (showCurrentPassword) {
        <label for="currentPasswordText">Current Password</label>

        <div class="password-input">
          <input
            id="currentPasswordText"
            name="currentPassword"
            type="text"
            [(ngModel)]="form.currentPassword"
            autocomplete="off"
          />

          <button
            type="button"
            (click)="showCurrentPassword = !showCurrentPassword"
            aria-label="Hide current password"
            aria-controls="currentPasswordText"
          >
            Hide
          </button>
        </div>
      } @else {
        <label for="currentPasswordPassword">Current Password</label>

        <div class="password-input">
          <input
            id="currentPasswordPassword"
            name="currentPassword"
            type="password"
            [(ngModel)]="form.currentPassword"
            autocomplete="current-password"
          />

          <button
            type="button"
            (click)="showCurrentPassword = !showCurrentPassword"
            aria-label="Show current password"
            aria-controls="currentPasswordPassword"
          >
            Show
          </button>
        </div>
      }
    </div>

    <div class="form-group">
      @if (showNewPassword) {
        <label for="newPasswordText">New Password</label>

        <div class="password-input">
          <input
            id="newPasswordText"
            name="newPassword"
            type="text"
            [(ngModel)]="form.newPassword"
            autocomplete="off"
          />

          <button
            type="button"
            (click)="showNewPassword = !showNewPassword"
            aria-label="Hide new password"
            aria-controls="newPasswordText"
          >
            Hide
          </button>
        </div>
      } @else {
        <label for="newPasswordPassword">New Password</label>

        <div class="password-input">
          <input
            id="newPasswordPassword"
            name="newPassword"
            type="password"
            [(ngModel)]="form.newPassword"
            autocomplete="new-password"
          />

          <button
            type="button"
            (click)="showNewPassword = !showNewPassword"
            aria-label="Show new password"
            aria-controls="newPasswordPassword"
          >
            Show
          </button>
        </div>
      }
    </div>

    <div class="form-group">
      @if (showConfirmPassword) {
        <label for="confirmPasswordText">Confirm New Password</label>

        <div class="password-input">
          <input
            id="confirmPasswordText"
            name="confirmPassword"
            type="text"
            [(ngModel)]="form.confirmPassword"
            autocomplete="off"
          />

          <button
            type="button"
            (click)="showConfirmPassword = !showConfirmPassword"
            aria-label="Hide confirm password"
            aria-controls="confirmPasswordText"
          >
            Hide
          </button>
        </div>
      } @else {
        <label for="confirmPasswordPassword">Confirm New Password</label>

        <div class="password-input">
          <input
            id="confirmPasswordPassword"
            name="confirmPassword"
            type="password"
            [(ngModel)]="form.confirmPassword"
            autocomplete="new-password"
          />

          <button
            type="button"
            (click)="showConfirmPassword = !showConfirmPassword"
            aria-label="Show confirm password"
            aria-controls="confirmPasswordPassword"
          >
            Show
          </button>
        </div>
      }
    </div>

    <button
      class="primary-btn"
      type="submit"
      [disabled]="isSaving"
    >
      {{ isSaving ? 'Changing...' : 'Change Password' }}
    </button>
  </form>
</div>
