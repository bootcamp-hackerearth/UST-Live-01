<div class="profile-page">
  <div class="page-header">
    <div>
      <h1>My Information</h1>
      <p>View and update your personal details.</p>
    </div>
  </div>

  @if (errorMessage) {
    <div class="alert-error">{{ errorMessage }}</div>
  }

  @if (successMessage) {
    <div class="alert-success">{{ successMessage }}</div>
  }

  @if (isLoading) {
    <div class="page-card">
      <p>Loading information...</p>
    </div>
  } @else {
    <form class="profile-card" (ngSubmit)="saveChanges()">
      <div class="form-grid">
        <div class="form-group full-width">
          <label>Full Name</label>
          <input type="text" [(ngModel)]="patient.fullName" name="fullName" />
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" [(ngModel)]="patient.dateOfBirth" name="dateOfBirth" />
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select [(ngModel)]="patient.gender" name="gender">
            <option value="0">Male</option>
            <option value="1">Female</option>
            <option value="2">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" [(ngModel)]="patient.phoneNumber" name="phoneNumber" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="patient.email" name="email" />
        </div>
      </div>

      <button class="primary-btn" type="submit" [disabled]="isSaving">
        {{ isSaving ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>
  }
</div>
