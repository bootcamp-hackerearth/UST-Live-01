<div class="password-page">
  <header class="page-header">
    <div>
      <h1>Change Password</h1>
      <p>Update your account password securely.</p>
    </div>
  </header>

  @if (errorMessage) {
    <div class="alert-error">
      {{ errorMessage }}
    </div>
  }

  @if (successMessage) {
    <div class="alert-success">
      {{ successMessage }}
    </div>
  }

  <form class="password-card" (ngSubmit)="submit()">
    <div class="form-group">
      @if (showCurrentPassword) {
        <label for="patientCurrentPasswordText">Current Password</label>

        <div class="password-input">
          <input
            id="patientCurrentPasswordText"
            name="currentPassword"
            type="text"
            [(ngModel)]="form.currentPassword"
            autocomplete="off"
          />

          <button
            type="button"
            (click)="showCurrentPassword = !showCurrentPassword"
            aria-label="Hide current password"
            aria-controls="patientCurrentPasswordText"
          >
            Hide
          </button>
        </div>
      } @else {
        <label for="patientCurrentPasswordPassword">Current Password</label>

        <div class="password-input">
          <input
            id="patientCurrentPasswordPassword"
            name="currentPassword"
            type="password"
            [(ngModel)]="form.currentPassword"
            autocomplete="current-password"
          />

          <button
            type="button"
            (click)="showCurrentPassword = !showCurrentPassword"
            aria-label="Show current password"
            aria-controls="patientCurrentPasswordPassword"
          >
            Show
          </button>
        </div>
      }
    </div>

    <div class="form-group">
      @if (showNewPassword) {
        <label for="patientNewPasswordText">New Password</label>

        <div class="password-input">
          <input
            id="patientNewPasswordText"
            name="newPassword"
            type="text"
            [(ngModel)]="form.newPassword"
            autocomplete="off"
          />

          <button
            type="button"
            (click)="showNewPassword = !showNewPassword"
            aria-label="Hide new password"
            aria-controls="patientNewPasswordText"
          >
            Hide
          </button>
        </div>
      } @else {
        <label for="patientNewPasswordPassword">New Password</label>

        <div class="password-input">
          <input
            id="patientNewPasswordPassword"
            name="newPassword"
            type="password"
            [(ngModel)]="form.newPassword"
            autocomplete="new-password"
          />

          <button
            type="button"
            (click)="showNewPassword = !showNewPassword"
            aria-label="Show new password"
            aria-controls="patientNewPasswordPassword"
          >
            Show
          </button>
        </div>
      }
    </div>

    <div class="form-group">
      @if (showConfirmPassword) {
        <label for="patientConfirmPasswordText">Confirm New Password</label>

        <div class="password-input">
          <input
            id="patientConfirmPasswordText"
            name="confirmPassword"
            type="text"
            [(ngModel)]="form.confirmPassword"
            autocomplete="off"
          />

          <button
            type="button"
            (click)="showConfirmPassword = !showConfirmPassword"
            aria-label="Hide confirm password"
            aria-controls="patientConfirmPasswordText"
          >
            Hide
          </button>
        </div>
      } @else {
        <label for="patientConfirmPasswordPassword">Confirm New Password</label>

        <div class="password-input">
          <input
            id="patientConfirmPasswordPassword"
            name="confirmPassword"
            type="password"
            [(ngModel)]="form.confirmPassword"
            autocomplete="new-password"
          />

          <button
            type="button"
            (click)="showConfirmPassword = !showConfirmPassword"
            aria-label="Show confirm password"
            aria-controls="patientConfirmPasswordPassword"
          >
            Show
          </button>
        </div>
      }
    </div>

    <button
      class="primary-btn"
      type="submit"
      [disabled]="isSaving"
    >
      {{ isSaving ? 'Changing...' : 'Change Password' }}
    </button>
  </form>
</div>
